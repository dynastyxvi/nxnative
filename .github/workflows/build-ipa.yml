name: Cloud Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Google Drive Share Link or Direct Link'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Build and Shaders
        uses: actions/cache@v4
        with:
          path: |
            ~/Games/InputGame/*_build
          key: ${{ runner.os }}-nxnative-shaders-${{ hashFiles('scripts/build_ipa_from_nsp.py') }}
          restore-keys: |
            ${{ runner.os }}-nxnative-shaders-

      - name: Set up Build Dependencies
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          python3 -m pip install lz4 capstone fonttools nsz zbic gdown --break-system-packages

      - name: Write Keys
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/InputGame
          gdown "${{ github.event.inputs.game_url }}" -O ~/Games/InputGame/game.nsp

      - name: Build IPA
        run: |
          export ALLOW_OTHER_METAL=True
          python3 scripts/build_ipa_from_nsp.py ~/Games/InputGame -k ~/.switch/prod.keys --allow-other-metal --no-motion

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-game-ipa
          path: ~/Games/InputGame/*.ipa
